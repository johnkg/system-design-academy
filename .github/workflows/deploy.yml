name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # let a deploy that has started finish; the next push queues behind it

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://${{ github.repository_owner }}.github.io
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # page dates (what's new, sitemap) come from git history
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check:content
      - run: npm run check:samples
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - run: npm run check:pages
      - run: npm run check:walkthroughs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
