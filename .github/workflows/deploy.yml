name: Deploy to GitHub Pages

# A push to main is published after the fast checks only (content, unit tests, types, build: about a minute). Every push to main
# came through a pull request, and the pull request already passed the whole of ci.yml, so the slow browser checks are not run
# again before publishing. They still run, beside the deploy, so a break that got in some other way (a direct push, a pull request
# merged on an old base) shows up as a red run on main instead of passing unnoticed. The weekly run also repeats every check.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    env:
      SITE: https://${{ github.repository_owner }}.github.io
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # page dates (what's new, sitemap) come from git history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm test
      - run: npm run check:types
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false # let a deploy that has started finish; the next push queues behind it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The same checks a pull request runs, in parallel with the deploy. Nothing waits for them.
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      site: https://${{ github.repository_owner }}.github.io
      base: /${{ github.event.repository.name }}
