name: Weekly health check

# Runs every check once a week even when nobody pushed, so drift in the toolchain (a new Node, .NET or browser release that
# breaks a sample or a page) shows up on its own instead of at the next deploy.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check:content
      - run: npm run check:samples
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - run: npm run check:pages
