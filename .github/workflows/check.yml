name: Check

# Runs on pull requests (and by hand). A push to a branch without a pull request runs nothing, so work-in-progress pushes
# cost no CI time; a newer push to the same pull request cancels the run it makes obsolete.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
