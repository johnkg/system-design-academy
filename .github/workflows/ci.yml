name: CI

# Every check, split into parallel jobs so a run takes minutes, not half an hour. Called by check.yml (pull requests),
# deploy.yml (main, then publishes) and weekly.yml. The slow part is the browser check of ~300 pages, so it is dealt out
# over PAGE_SHARDS jobs with `--shard i/n` (see scripts/shard.mjs); change both the matrix and its n together.
on:
  workflow_call:
    inputs:
      site:
        type: string
        default: ''
      base:
        type: string
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SITE: ${{ inputs.site }}
  BASE: ${{ inputs.base }}

jobs:
  static:
    name: Content and unit tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # page dates (what's new, sitemap) come from git history
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm test

  samples:
    name: Code samples
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check:samples

  build:
    name: Build
    timeout-minutes: 15
    needs: static # a content error fails in seconds, before anything slow starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 1

  pages:
    name: Pages ${{ matrix.shard }}/6
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let every shard report, so one run lists all the broken pages
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run check:pages -- --shard ${{ matrix.shard }}/6

  walkthroughs:
    name: Walkthroughs ${{ matrix.shard }}/3
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run check:walkthroughs -- --shard ${{ matrix.shard }}/3

  lighthouse:
    name: Lighthouse
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run check:lighthouse
