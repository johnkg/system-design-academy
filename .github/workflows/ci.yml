name: CI

# Every check, split into parallel jobs so a run takes minutes, not half an hour. Called by check.yml (pull requests),
# deploy.yml (main, then publishes) and weekly.yml. The slow part is the browser check of ~300 pages, so it is dealt out
# over PAGE_SHARDS jobs with `--shard i/n` (see scripts/shard.mjs); change both the matrix and its n together.
# Runners are pinned to ubuntu-24.04: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install a browser on.
# Move them together with the Playwright version in package.json.
on:
  workflow_call:
    inputs:
      site:
        type: string
        default: ''
      base:
        type: string
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SITE: ${{ inputs.site }}
  BASE: ${{ inputs.base }}

jobs:
  static:
    name: Content and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # page dates (what's new, sitemap) come from git history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm test
      - run: npm run check:types

  samples:
    name: Code samples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check:samples

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  pages:
    name: Pages ${{ matrix.shard }}/8
    needs: [static, build] # the build runs beside the content checks; a content error still stops the browser jobs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # let every shard report, so one run lists all the broken pages
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      # The runner image usually has the libraries Chromium needs; installing them with apt takes seconds when the mirror is quiet
      # and several minutes when it is busy. Install them only when Chromium cannot start.
      - name: Install system libraries if Chromium cannot start
        run: node -e "require('playwright').chromium.launch().then((b) => b.close())" || npx playwright install-deps chromium
      - run: npm run check:pages -- --shard ${{ matrix.shard }}/8

  walkthroughs:
    name: Walkthroughs ${{ matrix.shard }}/6
    needs: [static, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      # The runner image usually has the libraries Chromium needs; installing them with apt takes seconds when the mirror is quiet
      # and several minutes when it is busy. Install them only when Chromium cannot start.
      - name: Install system libraries if Chromium cannot start
        run: node -e "require('playwright').chromium.launch().then((b) => b.close())" || npx playwright install-deps chromium
      - run: npm run check:walkthroughs -- --shard ${{ matrix.shard }}/6

  lighthouse:
    name: Lighthouse
    needs: [static, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npm run check:lighthouse # uses the Google Chrome that the runner image has installed
